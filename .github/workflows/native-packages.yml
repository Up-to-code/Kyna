name: Optional native packages
on:
  workflow_dispatch:
  pull_request:
    paths: ['library/gui/**', 'library/geometry/**', 'library/ml/**', 'library/native/**', 'sdk/**', 'tools/android-shell/**', '.github/workflows/native-packages.yml']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Configure optional packages
        shell: bash
        run: cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DKYNA_WITH_GUI=ON -DKYNA_WITH_GEOMETRY=ON -DKYNA_WITH_ML=ON '-DVCPKG_MANIFEST_FEATURES=gui;geometry;ml' -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      - run: cmake --build build-native --config Release --parallel 3
      - run: ctest --test-dir build-native -C Release --output-on-failure
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.os }}
          path: build-native/native/**
  android-arm64:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'ndk;26.1.10909125' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: mac
          target: android
          arch: android_arm64_v8a
          install-deps: true
          dir: '${{ github.workspace }}/Qt'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: mac
          target: desktop
          arch: clang_64
          dir: '${{ github.workspace }}/Qt'
      - name: Cross-compile runtime and application shell
        shell: bash
        run: |
          "$GITHUB_WORKSPACE/Qt/Qt/6.7.3/android_arm64_v8a/bin/qt-cmake" -S . -B build-android -DCMAKE_BUILD_TYPE=Release -DKYNA_BUILD_TESTS=OFF -DKYNA_BUILD_CLI=OFF -DKYNA_WITH_GUI=ON -DKYNA_ANDROID_SHELL=ON -DQT_HOST_PATH="$GITHUB_WORKSPACE/Qt/Qt/6.7.3/macos" -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          cmake --build build-android --target apk --parallel 3
      - name: Sign APK with an ephemeral smoke-test key
        shell: bash
        run: python3 tests/native/sign_android_smoke.py "$(find build-android -name '*.apk' -print -quit)" build-android/kyna-smoke.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          target: google_apis
          script: |
            adb install build-android/kyna-smoke.apk
            adb logcat -c
            adb shell monkey -p org.kyna.application 1
            python3 tests/native/verify_android_smoke.py
      - uses: actions/upload-artifact@v6
        with:
          name: android-arm64
          path: build-android/**/*.apk
